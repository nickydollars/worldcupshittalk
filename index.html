<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Cup Shit Talk</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #111; font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        /* Logo Container at the top */
        #logo-container {
            width: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #222;
            box-sizing: border-box;
        }

        /* Responsive Logo Image */
        #logo-container img {
            max-height: 120px;
            width: auto;
            max-width: 90%;
            object-fit: contain;
        }

        /* Chat container scales to fill the rest of the screen */
        #chat-wrapper { 
            width: 100%; 
            flex-grow: 1; 
            height: 0;
        }
        #tlkio { width: 100% !important; height: 100% !important; border: none; }
    </style>
</head>
<body>

    <div id="logo-container">
        <img src="worldcupshittalk.png" alt="World Cup Shit Talk Logo">
    </div>

    <div id="chat-wrapper">
        <div id="tlkio" data-channel="worldcupshittalk" data-theme="theme--night" style="width:100%; height:100%;"></div>
        <script async src="https://tlk.io/embed.js" type="text/javascript"></script>
    </div>

</body>
</html>
