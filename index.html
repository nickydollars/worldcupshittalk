<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>World Cup Shit Talk</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%;
            height: 100vh;
            height: 100svh; /* Smart responsive mobile height */
            overflow: hidden; background-color: #111; font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Logo Container at the top */
        #logo-container {
            width: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #222;
            box-sizing: border-box;
        }

        /* Responsive Logo Image */
        #logo-container img {
            max-height: 240px; /* Big layout */
            width: auto;
            max-width: 95%;
            object-fit: contain;
        }

        /* Chat container scales to fill the rest of the screen */
        #chat-wrapper {
            width: 100%;
            flex-grow: 1;
            height: 0;
        }

        /* tlk.io injects its chat into this div; force it to fill the wrapper */
        #tlkio {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- LOGO BANNER -->
    <div id="logo-container">
        <img src="worldcupshittalk.png" alt="World Cup Shit Talk Logo">
    </div>

    <!-- OFFICIAL tlk.io EMBED (Night theme) -->
    <div id="chat-wrapper">
        <div id="tlkio" data-channel="worldcupshittalk" data-theme="theme--night"></div>
        <script async src="https://tlk.io/embed.js"></script>
    </div>

</body>
</html>
