    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;

        /* Modal Overlay */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            border: 2px solid #ff3b30; box-shadow: 0 0 20px rgba(255, 59, 48, 0.3);
        }
        h2 { color: #ff3b30; margin-top: 0; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444;
            background: #333; color: #fff; font-size: 16px; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #ff3b30; outline: none; }
        .btn-submit {
            background: #ff3b30; color: white; border: none; padding: 12px 20px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
            width: 100%; margin-top: 15px; text-transform: uppercase; transition: background 0.2s;
        }
        .btn-submit:hover { background: #e02e25; }
        /* Chat Frame Container */
        #chat-wrapper { width: 100%; height: 100%; display: none; }
        iframe { width: 100% !important; height: 100% !important; border: none !important; display: block; }
    </style>

    <script>
        function joinTheTerrace() {
            // 1. Verify reCAPTCHA Challenge First
            var captchaResponse = grecaptcha.getResponse();
            if (captchaResponse.length == 0) {
                alert("Prove you aren't an automated bot before entering the terrace.");
                return;
            }

            var name = document.getElementById('username').value.trim();
            var home = document.getElementById('homeCountry').value;
            var winner = document.getElementById('winnerCountry').value;

            if (!name) {
                alert("You need a username to shout on the terrace.");
                return;
            }

            // Clean flag text to extract just the flag emoji parts
            var homeFlag = home.split(' ')[0];
            var winnerFlag = winner.split(' ')[0];

            // Formats user identity to: Name 🇺🇸🔮🇧🇷
            var formattedIdentity = name + " " + homeFlag + "🔮" + winnerFlag;

            // Hide the modal, show the chat frame
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('chat-wrapper').style.display = 'block';

            // Programmatically logs user into the RumbleTalk embed via JavaScript SDK
            rtmq('login', {
                hash: 'yNJN4s6X',
                username: formattedIdentity
            });
        }
    </script>
