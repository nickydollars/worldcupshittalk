<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fixed: Added interactive-widget to force mobile keyboards to resize properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>World Cup Shit Talk</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; 
            height: 100vh;
            height: 100svh; /* Smart responsive mobile height */
            overflow: hidden; background-color: #111; font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        /* Logo Container at the top */
        #logo-container {
            width: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #222;
            box-sizing: border-box;
        }

        /* Responsive Logo Image */
        #logo-container img {
            max-height: 240px; /* Big layout */
            width: auto;
            max-width: 95%;
            object-fit: contain;
        }

        /* Chat container scales to fill the rest of the screen */
        #chat-wrapper { 
            width: 100%; 
            flex-grow: 1; 
            height: 0;
        }
        
        /* Fixed: Replaced script wrapper with a highly stable mobile iframe */
        #chat-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #111;
        }
    </style>
</head>
<body>

    <!-- LOGO BANNER -->
    <div id="logo-container">
        <img src="worldcupshittalk.png" alt="World Cup Shit Talk Logo">
    </div>

    <!-- THE STABLE IFRAME CHAT ROOM -->
    <div id="chat-wrapper">
        <iframe id="chat-frame" src="https://tlk.io/worldcupshittalk?custom_css=https://tlk.io/stylesheets/embed.css&theme=night&embed=1" allow="clipboard-write"></iframe>
    </div>

</body>
</html>
